<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="icon" type="image/x-icon" href="/images/initials.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1e1e1e;
            padding: 20px;
            text-align: center;
        }

        nav a {
            margin: 0 15px;
            color: #fff;
            text-decoration: none;
        }

        ul.no-bullets {
            list-style-type: none; /* Remove bullets */
            padding: 0; /* Remove padding */
            margin: 0; /* Remove margins */
            font-size: 60px
        }

        .section {
            padding: 40px 20px;
            max-width: 1100px;
            margin: auto;
        }

        label, select {
            font-size: 1rem;
        }

        #tagFilter {
            background: #1e1e1e;
            color: #f4f4f4;
            padding: 8px;
            margin: 20px 0;
            border: 1px solid #333;
            border-radius: 5px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            justify-content: start;
            
        }

        .card {
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

            /* Hover/inflate effect */
            .card:hover {
                transform: scale(1.05);
                box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            }

            .card img {
                width: 100%;
                height: 200px;
                object-fit: cover;
            }

        .card-body {
            padding: 15px;
            flex: 1;
        }

        .card h3 {
            margin-top: 0;
        }

        .card-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            padding: 0 15px 15px;
        }

            .card-buttons a {
                padding: 8px 16px;
                border-radius: 5px;
                text-decoration: none;
                font-weight: bold;
                color: #fff;
                transition: background 0.3s;
            }

                .card-buttons a:first-child {
                    background: #4caf50; /* Green for Play */
                }

                    .card-buttons a:first-child:hover {
                        background: #43a047;
                    }

                .card-buttons a:last-child {
                    background: #2196f3; /* Blue for Code */
                }

                    .card-buttons a:last-child:hover {
                        background: #1976d2;
                    }

        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 40px;
            width: 100%;
        }

        .carousel-track-wrapper {
            width: 960px; /* 3 cards visible (adjust as needed) */
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
            will-change: transform;
        }

            .carousel-track .card {
                flex: 0 0 300px;
                margin: 0 10px;
                transition: transform 0.3s, opacity 0.3s;
                opacity: 0.6;
                transform: scale(0.9);
            }

                .carousel-track .card.active {
                    opacity: 1;
                    transform: scale(1.1);
                }

        #carousel-prev,
        #carousel-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            background: none;
            color: #fff;
            border: none;
            cursor: pointer;
            z-index: 10;
        }

        #carousel-prev {
            left: 0;
        }

        #carousel-next {
            right: 0;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #1e1e1e;
        }
    </style>
</head>
<body>

    <header>
        <h1>Thomas Bushnell</h1>
        <p>Game Programmer Portfolio</p>
        <nav>
            <a style="font-weight:900" href="#projects">Projects</a>
            <a style="font-weight:900" href="#skills">Skills</a>
            <a style="font-weight:900" href="#experience">Experience</a>
            <a style="font-weight:900" href="#about">About Me</a>
        </nav>
    </header>

    <section class="section" id="highlights">
        <h2>Highlights</h2>
        <div class="carousel-container">
            <button id="carousel-prev">&#10094;</button>
            <div class="carousel-track-wrapper">
                <div class="carousel-track" id="highlightCarouselTrack"></div>
            </div>
            <button id="carousel-next">&#10095;</button>
        </div>
    </section>

    <section class="section" id="projects">
        <h2>Projects</h2>

        <label for="tagFilter">Filter by tag:</label>
        <select id="tagFilter">
            <option value="all">All</option>
        </select>

        <div class="projects-grid" id="projectContainer"></div>
    </section>
    <section class="section" id="skills">
        <h2>Skills</h2>
        <ul class="no-bullets">
            <li class="list-inline-item">
                <i class="devicon-csharp-plain"></i>
            </li>
            <li class="list-inline-item">
                <i class="devicon-cplusplus-plain"></i>
            </li>
            <li class="list-inline-item">
                <i class="devicon-unity-plain"></i>
            </li>
            <li class="list-inline-item">
                <i class="devicon-visualstudio-plain"></i>
            </li>
            <li class="list-inline-item">
                <i class="devicon-github-plain"></i>
            </li>
        </ul>

    </section>

    <section class="section" id="experience">
        <h2>Experience</h2>
        <ul>
            <li>Micronav - Automated Testing</li>
        </ul>
    </section>


    <footer>
        <p>&copy; Thomas Bushnell</p>
    </footer>

    <script>
            let allProjects = [];

            function getGitHubRepoInfo() {
                const host = window.location.hostname; // e.g. "tttommyb.github.io"
                const pathParts = window.location.pathname.split('/').filter(Boolean);

                if (host.endsWith('.github.io')) {
                    const user = host.split('.')[0];
                    // If hosted at user.github.io/RepoName/, the repo is pathParts[0].
                    // If hosted at the root user.github.io/, the repo is user.github.io.
                    const repo = (pathParts.length > 0 && !pathParts[0].endsWith('.html'))
                        ? pathParts[0]
                        : `${user}.github.io`;
                    return { user, repo };
                }
                return null;
            }

            async function getProjectFileList() {
                const repoInfo = getGitHubRepoInfo();

                if (repoInfo) {
                    try {
                        const apiUrl = `https://api.github.com/repos/${repoInfo.user}/${repoInfo.repo}/contents/projects`;
                        const res = await fetch(apiUrl);
                        if (res.ok) {
                            const files = await res.json();
                            return files
                                .filter(f => f.name.endsWith('.json') && f.name !== 'manifest.json')
                                .map(f => f.name);
                        }
                    } catch (err) {
                        console.warn('GitHub API fetch failed, using fallback list:', err);
                    }
                }

                // Local fallback when testing on your PC before pushing to GitHub
                return [
                    'Spells-And-Stuff.json',
                    'Planet-Gen.json',
                    'Platformer.json',
                    'Space-Invaders.json',
                    'Co-OpPuzzle.json',
                    'Interactive.json',
                    'Villagewright.json'
                ];
            }

            async function loadProjects() {
                const tagSelect = document.getElementById('tagFilter');
                const tags = new Set();
                const projectFiles = await getProjectFileList();

                for (const file of projectFiles) {
                    try {
                        const res = await fetch('projects/' + file);
                        if (!res.ok) continue;
                        const proj = await res.json();
                        proj._id = file.replace('.json', '');
                        allProjects.push(proj);
                        (proj.tags || []).forEach(t => tags.add(t));
                    } catch (err) {
                        console.error(`Error loading ${file}:`, err);
                    }
                }

                tags.forEach(t => {
                    const o = document.createElement('option');
                    o.value = t;
                    o.textContent = t;
                    tagSelect.appendChild(o);
                });

                tagSelect.addEventListener('change', () => display(tagSelect.value));
                display('all');

                const featuredProjects = allProjects.filter(p => p.featured);
                if (featuredProjects.length > 0) {
                    displayCarousel(featuredProjects);
                }
            }

            function buildCardElement(project, isClone = false) {
                const card = document.createElement('div');
                card.className = 'card';
                if (isClone) card.classList.add('clone');

                const imageUrl = project.image || '';
                const description = project.description || '';

                card.innerHTML = `
                    <img src="${imageUrl}" alt="${project.title}">
                    <div class="card-body">
                        <h3>${project.title}</h3>
                        <p>${description}</p>
                    </div>
                `;

                const buttonsDiv = document.createElement('div');
                buttonsDiv.className = 'card-buttons';

                if (project.playLink) {
                    const playButton = document.createElement('a');
                    playButton.href = project.playLink;
                    playButton.target = "_blank";
                    playButton.textContent = "Play";
                    buttonsDiv.appendChild(playButton);
                }

                if (project.codeLink) {
                    const codeButton = document.createElement('a');
                    codeButton.href = project.codeLink;
                    codeButton.target = "_blank";
                    codeButton.textContent = "Code";
                    buttonsDiv.appendChild(codeButton);
                }

                if (buttonsDiv.children.length > 0) {
                    card.appendChild(buttonsDiv);
                }

                card.addEventListener('click', (event) => {
                    if (!event.target.closest('.card-buttons a')) {
                        const targetUrl = project.detailLink || `project.html?id=${encodeURIComponent(project._id)}`;
                        location.href = targetUrl;
                    }
                });

                return card;
            }

            function displayCarousel(projects) {
                const track = document.getElementById('highlightCarouselTrack');
                const trackWrapper = document.querySelector('.carousel-track-wrapper');
                const visibleCards = 3;
                const cardWidth = 320;
                let currentIndex = visibleCards;

                function setupCarousel() {
                    track.innerHTML = '';
                    const total = projects.length;

                    for (let i = total - visibleCards; i < total; i++) {
                        track.appendChild(buildCardElement(projects[(i + total) % total], true));
                    }
                    projects.forEach(p => {
                        track.appendChild(buildCardElement(p));
                    });
                    for (let i = 0; i < visibleCards; i++) {
                        track.appendChild(buildCardElement(projects[i % total], true));
                    }

                    updateCarouselPosition(false);
                }

                function updateCarouselPosition(animate = true) {
                    const wrapperWidth = trackWrapper.offsetWidth;
                    const targetCardLeft = currentIndex * cardWidth;
                    const centerOffset = (wrapperWidth / 2) - (cardWidth / 2);
                    const finalOffset = -targetCardLeft + centerOffset;

                    track.style.transition = animate ? 'transform 0.5s ease' : 'none';
                    track.style.transform = `translateX(${finalOffset}px)`;

                    const cards = track.querySelectorAll('.card');
                    cards.forEach(card => card.classList.remove('active'));
                    if (cards[currentIndex]) cards[currentIndex].classList.add('active');
                }

                function shiftCarousel(direction) {
                    const total = projects.length;
                    currentIndex += direction;
                    updateCarouselPosition(true);

                    track.addEventListener('transitionend', () => {
                        if (currentIndex >= total + visibleCards) {
                            currentIndex = visibleCards;
                            updateCarouselPosition(false);
                        } else if (currentIndex < visibleCards) {
                            currentIndex = total + visibleCards - 1;
                            updateCarouselPosition(false);
                        }
                    }, { once: true });
                }

                document.getElementById('carousel-prev').onclick = () => shiftCarousel(-1);
                document.getElementById('carousel-next').onclick = () => shiftCarousel(1);

                setupCarousel();
            }

            function display(filterTag) {
                const container = document.getElementById('projectContainer');
                container.innerHTML = '';
                const list = filterTag === 'all'
                    ? allProjects
                    : allProjects.filter(p => p.tags && p.tags.includes(filterTag));

                list.forEach(p => {
                    container.appendChild(buildCardElement(p));
                });
            }

            loadProjects();
    </script>

</body>
</html>
